<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Marble Run</title>
<meta name="theme-color" content="#FCE3C4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marble Run">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
  /* Layout: a 3D pegboard fills the stage above (portrait) or left of (landscape) the parts tray; the tray holds the parts with their counts, the big Drop button and Tidy-up; home top-left, level dots and stars top-centre, mute top-right; the win card is an overlay */
  :root{
    --wall:#FCE3C4; --cream:#FFF8E7; --lip:#E6D3A8; --ink:#2B2B3A; --gold:#FFC93C; --gold-edge:#E59A00;
    --go:#35C24A; --go-edge:#23912F; --tray:#DDEFFF; --tray-edge:#A9CFF0;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    --part:clamp(56px,16vw,78px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--wall);font-family:var(--title);color:var(--ink);
    touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:grid;grid-template-rows:1fr auto;grid-template-columns:1fr}
  #stage{position:relative;min-height:0;min-width:0;overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none}
  svg{display:block}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #hud{position:absolute;top:calc(10px + var(--st));left:64px;right:64px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
  #dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto}
  .dot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font:bold 12px/1 Verdana,Tahoma,sans-serif;color:rgba(43,43,58,.45)}
  .dot.done{background:var(--gold);color:#7a4b00}
  .dot.now{background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--gold-edge)}
  .dot.locked{opacity:.45}
  #stars{display:flex;gap:4px;padding:3px 10px;border-radius:14px;background:rgba(255,255,255,.7)}
  #stars:empty{display:none}
  #stars svg{width:24px;height:24px}
  #stars .got path{fill:var(--gold);stroke:var(--gold-edge)}
  #mute{position:fixed;z-index:46;top:calc(10px + var(--st));right:calc(10px + var(--sr));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #mute svg{width:26px;height:26px}

  /* ---------- tray ---------- */
  #tray{background:var(--tray);border-top:4px solid var(--tray-edge);padding:10px calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl));
    display:flex;align-items:center;justify-content:center;gap:14px;z-index:30}
  #parts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .part{position:relative;width:var(--part);height:var(--part);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--tray-edge);display:grid;place-items:center;touch-action:none}
  .part svg{width:80%;height:80%;pointer-events:none}
  .part .n{position:absolute;right:-6px;top:-6px;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:#fff;font:bold 15px/26px Verdana,Tahoma,sans-serif;text-align:center;padding:0 5px;pointer-events:none}
  .part.empty{opacity:.35}
  .part.sel{box-shadow:0 0 0 4px var(--gold-edge),0 4px 0 var(--tray-edge);transform:translateY(-3px)}
  #btns{display:flex;flex-direction:column;align-items:center;gap:10px}
  #drop{width:calc(var(--part)*1.3);height:calc(var(--part)*1.3);border-radius:50%;background:var(--go);box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #drop svg{width:62%;height:62%}
  #drop:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}
  #tidy{width:var(--part);height:calc(var(--part)*.62);border-radius:14px;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:grid;place-items:center}
  #tidy svg{width:44%;height:80%}
  #tidy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  #floater{position:fixed;z-index:70;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;opacity:.9}
  #floater svg{width:100%;height:100%}

  @media (min-aspect-ratio:5/4){
    body{grid-template-rows:1fr;grid-template-columns:1fr auto}
    #tray{flex-direction:column;border-top:0;border-left:4px solid var(--tray-edge);padding:calc(10px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) 12px}
    #parts{display:grid;grid-template-columns:repeat(2,var(--part));gap:12px}
    :root{--part:clamp(48px,min(7vw,13vh),78px)}
  }

  /* ---------- win card ---------- */
  #win{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(255,248,231,.35)}
  #win .box{background:var(--cream);border-radius:28px;padding:22px 30px 26px;box-shadow:0 8px 0 var(--lip),0 14px 30px rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;gap:14px;animation:pop .35s ease-out}
  #win .big{font-size:46px;line-height:1}
  #win h2{margin:0;font-size:30px}
  #next{width:96px;height:96px;border-radius:50%;background:var(--go);color:#fff;box-shadow:0 6px 0 var(--go-edge);display:grid;place-items:center}
  #next svg{width:50%;height:50%}
  #next:active{transform:translateY(5px);box-shadow:0 1px 0 var(--go-edge)}

  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes nudge{0%,100%{transform:none}30%{transform:scale(1.15)}60%{transform:scale(.95)}}
  .nudge{animation:nudge .5s ease-in-out 2}
</style>
</head>
<body>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><div id="dots"></div><div id="stars"></div></div>
</div>
<button id="mute" aria-label="Sound on or off"></button>
<div id="tray">
  <div id="parts"></div>
  <div id="btns">
    <button id="drop" aria-label="Drop a marble"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#4dabf7" stroke="#fff" stroke-width="2"/><path d="M8.5 10.5a4 4 0 0 1 4-3" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    <button id="tidy" aria-label="Put all parts back"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-7.4 5" fill="none" stroke="#8a6d3b" stroke-width="2.8" stroke-linecap="round"/><path d="M2 4.5 4.8 9.6 9.6 7" fill="none" stroke="#8a6d3b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<div id="floater" hidden></div>
<div id="win" hidden>
  <div class="box">
    <div class="big" id="winBig">🎉</div>
    <h2 id="winText">Plop!</h2>
    <button id="next" aria-label="Next board"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ======== tuning knobs ======== */
const COLS = 6, ROWS = 8;      // the pegboard, in squares
const GRAVITY = 16;            // squares per second²
const MARBLE_R = 0.14;         // marble radius (a square is 1)
const BOUNCE_MIN = 6.2;        // the trampoline always throws at least this fast (about 1¼ squares high)
const MAX_SPEED = 13;
const MAX_MARBLES = 6;         // marbles rolling at once
const SUBSTEPS = 8;            // physics steps per frame
const STUCK_SECS = 3;          // a marble that sits still this long fades away
const FRICTION = 0.0006;       // speed lost along a surface per physics step

// drop: the column the marble falls from; cup: the column of the cup on the bottom row;
// stars: squares [column, row] (row 0 is the bottom) to roll through first; tray: parts to place;
// fixed: parts already on the board that can't be moved (f: 1 slopes down to the right, -1 to the left).
const LEVELS = [
  { drop: 2, cup: 2, stars: [[2, 4]], tray: { ramp: 1 } },
  { drop: 1, cup: 4, stars: [], tray: { ramp: 1, funnel: 1 } },
  { drop: 4, cup: 1, stars: [[2, 3]], tray: { ramp: 2 } },
  { drop: 1, cup: 5, stars: [], tray: { bouncer: 1, funnel: 1 } },
  { drop: 1, cup: 4, stars: [[3, 5]], tray: { ramp: 1, bell: 1, funnel: 1 } },
  { drop: 5, cup: 0, stars: [[3, 5], [1, 2]], tray: { ramp: 3, funnel: 1 } },
  { drop: 0, cup: 5, stars: [[3, 3]], tray: { xylo: 2, funnel: 1 } },
  { drop: 2, cup: 3, stars: [], tray: { ramp: Infinity, xylo: Infinity, funnel: Infinity, bouncer: Infinity, bell: Infinity }, free: true },
];
const PART_ORDER = ['ramp', 'funnel', 'bouncer', 'bell', 'xylo'];
const FLIPS = { ramp: true, xylo: true, bouncer: true };

/* ======== small helpers ======== */
const NS = 'marblerun.';
const load = (k, d = null) => { try { const v = localStorage.getItem(NS + k); return v === null ? d : v; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(NS + k, String(v)); } catch {} };
const TEST = /[?&]tbxtest\b/.test(location.search) || navigator.webdriver === true;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
const easeInOut = (k) => k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;

/* ======== sound (Web Audio, all synthesized) ======== */
const Sound = (() => {
  let ac = null, out = null;
  let muted = TEST || load('muted') === '1';
  const NOTE = (n) => 440 * 2 ** ((n - 69) / 12);
  function ctx() {
    if (muted) return null;
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.8; out.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, dur, o = {}) {
    const c = ctx(); if (!c) return;
    const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.001, o.vol || 0.16), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + dur + 0.05);
  }
  return {
    get muted() { return muted; },
    setMuted(m) { muted = m; save('muted', m ? '1' : '0'); if (m) ac?.suspend(); else ctx(); },
    unlock() { ctx(); },
    tick(speed) { tone(900 + Math.random() * 500, 0.035, { type: 'triangle', vol: Math.min(0.1, speed * 0.012) }); },
    boing() { tone(170, 0.32, { to: 460, vol: 0.2 }); tone(340, 0.2, { to: 900, vol: 0.05, type: 'triangle' }); },
    bell(i) { const f = NOTE(79 + PENTA[i % PENTA.length]); [1, 2.76, 5.4].forEach((k, j) => tone(f * k, 1.4 / (j + 1), { vol: 0.12 / (j + 1) })); },
    xylo(i) { tone(NOTE(72 + PENTA[i % PENTA.length]), 0.4, { type: 'triangle', vol: 0.17 }); tone(NOTE(84 + PENTA[i % PENTA.length]), 0.12, { vol: 0.05 }); },
    star() { [84, 88, 91, 96].forEach((n, i) => tone(NOTE(n), 0.16, { at: i * 0.06, type: 'triangle', vol: 0.12 })); },
    cup() { tone(NOTE(88), 0.25, { vol: 0.14 }); tone(NOTE(95), 0.35, { at: 0.07, vol: 0.12 }); },
    win() { [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => tone(NOTE(n), 0.24, { at: i * 0.1, type: 'triangle', vol: 0.15 })); },
    lost() { tone(300, 0.3, { to: 120, vol: 0.08 }); },
    drop() { tone(NOTE(81), 0.08, { type: 'triangle', vol: 0.12 }); tone(NOTE(76), 0.1, { at: 0.06, type: 'triangle', vol: 0.1 }); },
    place() { tone(150, 0.12, { to: 90, vol: 0.22 }); tone(1200, 0.03, { type: 'triangle', vol: 0.05 }); },
    flip() { tone(700, 0.05, { type: 'triangle', vol: 0.1 }); tone(1000, 0.05, { at: 0.05, type: 'triangle', vol: 0.1 }); },
    back() { tone(500, 0.15, { to: 250, vol: 0.1 }); },
    nope() { tone(220, 0.12, { type: 'triangle', vol: 0.1 }); tone(196, 0.16, { at: 0.12, type: 'triangle', vol: 0.1 }); },
  };
})();

/* ======== physics (2D, in board squares; x right, y up, row 0 at the bottom) ======== */
// Colliders: segments with a thickness (planks, walls) and circles (bells). Rebuilt whenever a part moves.
let segs = [], circles = [], stars = [], cupX = 0;
function buildColliders(level, parts) {
  segs = []; circles = [];
  const S = (ax, ay, bx, by, o = {}) => segs.push({ ax, ay, bx, by, r: 0.04, e: 0.25, kind: 'wood', ...o });
  S(0, -2, 0, ROWS + 3, { r: 0.05, kind: 'wall' }); S(COLS, -2, COLS, ROWS + 3, { r: 0.05, kind: 'wall' });
  cupX = level.cup + 0.5;
  S(cupX - 0.4, 0.78, cupX - 0.32, 0.1, { kind: 'cup' }); S(cupX - 0.32, 0.1, cupX + 0.32, 0.1, { kind: 'cup' }); S(cupX + 0.32, 0.1, cupX + 0.4, 0.78, { kind: 'cup' });
  for (const p of parts) {
    const cx = p.c + 0.5, cy = p.r + 0.5, f = p.f || 1;
    const P = (ax, ay, bx, by, o) => S(cx + ax * f, cy + ay, cx + bx * f, cy + by, { part: p, ...o });
    if (p.t === 'ramp') P(-0.5, 0.22, 0.5, -0.22);
    else if (p.t === 'xylo') P(-0.5, 0.22, 0.5, -0.22, { kind: 'xylo' });
    else if (p.t === 'funnel') { P(-0.48, 0.42, -0.22, 0); P(-0.22, 0, -0.22, -0.42); P(0.48, 0.42, 0.22, 0); P(0.22, 0, 0.22, -0.42); }
    else if (p.t === 'bouncer') P(-0.3, 0.02, 0.3, -0.3, { kind: 'bounce', r: 0.05 });
    else if (p.t === 'bell') circles.push({ x: cx, y: cy + 0.02, r: 0.21, e: 0.55, kind: 'bell', part: p });
  }
}

function physStep(ms, h, ev) {
  for (const m of ms) {
    if (m.gone) continue;
    m.vy -= GRAVITY * h;
    const sp = Math.hypot(m.vx, m.vy); if (sp > MAX_SPEED) { m.vx *= MAX_SPEED / sp; m.vy *= MAX_SPEED / sp; }
    m.x += m.vx * h; m.y += m.vy * h;
    for (const s of segs) {
      const abx = s.bx - s.ax, aby = s.by - s.ay;
      const t = clamp(((m.x - s.ax) * abx + (m.y - s.ay) * aby) / (abx * abx + aby * aby), 0, 1);
      const dx = m.x - (s.ax + abx * t), dy = m.y - (s.ay + aby * t), d2 = dx * dx + dy * dy, min = MARBLE_R + s.r;
      if (d2 >= min * min || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      m.x += nx * (min - d); m.y += ny * (min - d);
      const vn = m.vx * nx + m.vy * ny;
      if (vn >= 0) continue;
      const tx = -ny, ty = nx, vt = (m.vx * tx + m.vy * ty) * (1 - FRICTION);
      let out;
      if (s.kind === 'bounce' && ny > 0) out = Math.max(-vn * 0.85, BOUNCE_MIN);
      else out = -vn > 1.2 ? -vn * s.e : 0;      // small knocks don't bounce, so the marble settles and rolls
      m.vx = nx * out + tx * vt; m.vy = ny * out + ty * vt;
      ev.hit?.(m, s, -vn, t);
    }
    for (const c of circles) {
      const dx = m.x - c.x, dy = m.y - c.y, d2 = dx * dx + dy * dy, min = MARBLE_R + c.r;
      if (d2 >= min * min || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      m.x += nx * (min - d); m.y += ny * (min - d);
      const vn = m.vx * nx + m.vy * ny; if (vn >= 0) continue;
      m.vx -= (1 + c.e) * vn * nx; m.vy -= (1 + c.e) * vn * ny;
      ev.hit?.(m, c, -vn, 0);
    }
    for (const st of stars) if (!st.got && (m.x - st.x) ** 2 + (m.y - st.y) ** 2 < 0.33 ** 2) { st.got = true; ev.star?.(st, m); }
    if (Math.abs(m.x - cupX) < 0.3 && m.y < 0.62 && m.y > 0.1) { m.gone = 'cup'; ev.cup?.(m); continue; }
    if (m.y < -1.2) { m.gone = 'lost'; ev.lost?.(m); continue; }
    m.still = Math.hypot(m.vx, m.vy) < 0.25 ? (m.still || 0) + h : 0;
    if (m.still > STUCK_SECS) { m.gone = 'lost'; ev.lost?.(m); }
  }
  // marbles push each other apart
  for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
    const a = ms[i], b = ms[j]; if (a.gone || b.gone) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, min = 2 * MARBLE_R;
    if (d2 >= min * min || d2 === 0) continue;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, push = (min - d) / 2;
    a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push;
    const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rel < 0) { const k = rel * 0.9; a.vx += nx * k; a.vy += ny * k; b.vx -= nx * k; b.vy -= ny * k; }
  }
}
const newMarble = (col) => ({ x: col + 0.5, y: ROWS + 0.35, vx: 0, vy: 0, still: 0 });

// Run one marble without drawing anything: used to check that every level can be solved.
function simulate(level, parts, secs = 14) {
  const keep = stars;
  stars = level.stars.map(([c, r]) => ({ x: c + 0.5, y: r + 0.5, got: false }));
  buildColliders(level, parts);
  const m = newMarble(level.drop), h = 1 / (60 * SUBSTEPS); let n = 0;
  for (let i = 0; i < secs / h && !m.gone; i++) physStep([m], h, {}), n++;
  const res = { end: m.gone || 'time', stars: stars.filter((s) => s.got).length, of: stars.length, secs: +(n * h).toFixed(2) };
  stars = keep;
  if (level) buildColliders(level, window.__mr.parts());
  return res;
}

/* ======== part pictures (tray) ======== */
const PART_SVG = {
  ramp: '<svg viewBox="0 0 48 48"><circle cx="13" cy="10" r="6" fill="#4dabf7"/><path d="M4 19 44 33" stroke="#E8913A" stroke-width="7" stroke-linecap="round"/><path d="M4 19 44 33" stroke="#F4B26B" stroke-width="3" stroke-linecap="round"/></svg>',
  funnel: '<svg viewBox="0 0 48 48"><path d="M6 10 18 26v14M42 10 30 26v14" fill="none" stroke="#1FAFA2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bouncer: '<svg viewBox="0 0 48 48"><path d="M10 34v8M38 26v16" stroke="#9aa5b1" stroke-width="3"/><path d="M8 28q3-2 6 0t6 0M30 22q3-2 6 0t6 0" fill="none" stroke="#9aa5b1" stroke-width="2.5"/><path d="M5 24 43 12" stroke="#F0504A" stroke-width="8" stroke-linecap="round"/><path d="M6 44h36" stroke="#8a6d3b" stroke-width="4" stroke-linecap="round"/></svg>',

function showFloater(t, e) { const f = $('floater'); if (f.dataset.t !== t) { f.innerHTML = PART_SVG[t]; f.dataset.t = t; } f.hidden = false; f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px'; }

$('parts').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('[data-t]'); if (!b || drag) return;
  Sound.unlock();
  const t = b.dataset.t;
  if (!tray[t]) { Sound.nope(); nudge(b); return; }
  drag = { from: 'tray', t, f: 1, sx: e.clientX, sy: e.clientY, moved: false, id: e.pointerId };
});
$('c').addEventListener('pointerdown', (e) => {
  if (drag) return;
  Sound.unlock();
  const bp = boardPoint(e); if (!bp) return;
  if (Math.abs(bp.x - (level.drop + 0.5)) < 0.55 && bp.y > ROWS - 0.05) { drop(); return; }
  const cell = cellOf(bp); if (!cell) return;
  const p = partAt(cell.c, cell.r);
  if (p && p.fixed) { wiggle(p); return; }
  if (p) { drag = { from: 'board', p, t: p.t, f: p.f, sx: e.clientX, sy: e.clientY, moved: false, id: e.pointerId }; return; }
  if (selected && tray[selected] && cellFree(cell.c, cell.r)) {
    place(selected, cell.c, cell.r); if (tray[selected] !== Infinity) tray[selected]--;
    if (!tray[selected]) selected = null;
    renderTray();
  }
});
addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) {
    drag.moved = true;
    if (drag.from === 'board') unplace(drag.p);
  }
  if (!drag.moved) return;
  const cell = cellOf(boardPoint(e));
  if (cell) { showGhost(drag.t, drag.f, cell.c, cell.r, cellFree(cell.c, cell.r)); $('floater').hidden = true; }
  else { hideGhost(); showFloater(drag.t, e); }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null; hideGhost(); $('floater').hidden = true;
  if (!d.moved) {
    if (d.from === 'tray') { selected = selected === d.t ? null : d.t; Sound.flip(); renderTray(); }
    else flip(d.p);
    return;
  }
  const cell = e.type === 'pointerup' ? cellOf(boardPoint(e)) : null;
  if (cell && cellFree(cell.c, cell.r)) {
    place(d.t, cell.c, cell.r, d.f);
    if (d.from === 'tray' && tray[d.t] !== Infinity) tray[d.t]--;
  } else if (d.from === 'board') {
    if (cell) { place(d.t, d.p.c, d.p.r, d.f); }                       // dropped on a taken square: it goes back where it was
    else { if (tray[d.t] !== Infinity) tray[d.t]++; Sound.back(); }    // dropped off the board: back in the tray
  }
  renderTray();
}
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);

/* ======== tweens ======== */
const tweens = new Set();
function tween(ms, fn, ease = easeInOut) { return new Promise((res) => tweens.add({ t0: performance.now(), ms, fn, ease, res })); }

/* ======== camera fit + main loop ======== */
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const target = new THREE.Vector3(0, 0, 0), dir = new THREE.Vector3(0, 0.12, 1).normalize(), v = new THREE.Vector3();
  const o = boardG.position, pts = [];
  for (const x of [-0.25, COLS + 0.25]) for (const y of [-0.8, ROWS + 1.2]) for (const z of [-0.2, 0.3]) pts.push(new THREE.Vector3(x + o.x, y + o.y, z));
  const topRoom = 1 - 2 * ((level && level.stars.length ? 80 : 50) / h);
  const place = (d) => { camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); };
  // centre the board between the HUD and the bottom edge
  let lo = 2, hi = 80;
  for (let k = 0; k < 28; k++) { const mid = (lo + hi) / 2; place(mid); const ok = pts.every((p) => { v.copy(p).project(camera); return Math.abs(v.x) <= 0.95 && v.y <= topRoom && v.y >= -0.97; }); if (ok) hi = mid; else lo = mid; }
  place(hi);
}
new ResizeObserver(fitCamera).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  for (const tw of [...tweens]) { const k = Math.min(1, (now - tw.t0) / tw.ms); tw.fn(tw.ease(k)); if (k >= 1) { tweens.delete(tw); tw.res(); } }
  const live = marbles.filter((m) => !m.gone);
  if (live.length) {
    const h = dt / SUBSTEPS;
    for (let i = 0; i < SUBSTEPS; i++) physStep(live, h, events);
    for (const m of live) { if (m.gone) continue; const dx = m.x - m.mesh.position.x; m.mesh.position.set(m.x, m.y, 0); m.mesh.rotation.z -= dx / MARBLE_R; }
  }
  marbles = marbles.filter((m) => !m.gone || m.mesh.parent);
  const t = now / 1000;
  for (const s of stars) if (!s.got) { s.mesh.rotation.y = Math.sin(t * 2 + s.x) * 0.6; s.mesh.position.z = Math.sin(t * 3 + s.y) * 0.03; }
  if (hopper) hopper.children.at(-1).rotation.z = t;
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i], d = s.userData; d.life -= dt * 1.2; d.vy -= 9 * dt;
    s.position.x += d.vx * dt; s.position.y += d.vy * dt; s.rotation.x += dt * 6; s.scale.setScalar(Math.max(0.01, d.life));
    if (d.life <= 0) { boardG.remove(s); sparks.splice(i, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// a hook for checks (solving levels without drawing them)
window.__mr = { LEVELS, simulate, COLS, ROWS, parts: () => parts, marbles: () => marbles,
  tick(secs) { const h = 1 / (60 * SUBSTEPS); for (let i = 0; i < secs / h; i++) physStep(marbles.filter((m) => !m.gone), h, events); } };

renderMute();
loadLevel(unlocked);
requestAnimationFrame(frame);
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {

    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
}
